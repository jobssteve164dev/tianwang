name: Repository verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tianwang_v2_test
          POSTGRES_USER: tianwang
          POSTGRES_PASSWORD: tianwang_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tianwang -d tianwang_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: tianwang_v2_test
      DB_USER: tianwang
      DB_PASSWORD: tianwang_test_password
      JWT_SECRET: ci-only-jwt-secret
      ENCRYPTION_KEY: ci-only-encryption-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix agents ci

      - name: Validate deployment configuration
        env:
          BOOTSTRAP_ADMIN_USERNAME: fixtureadmin
          BOOTSTRAP_ADMIN_EMAIL: fixture@example.test
          BOOTSTRAP_ADMIN_PASSWORD: FixtureAdminPassword1!
        run: |
          node --test tests/deployment/compose.cjs
          docker compose -f docker-compose.build.yml config --quiet

      - name: Apply database schema
        env:
          BOOTSTRAP_ADMIN_USERNAME: fixtureadmin
          BOOTSTRAP_ADMIN_EMAIL: fixture@example.test
          BOOTSTRAP_ADMIN_PASSWORD: FixtureAdminPassword1!
        run: npm run db:migrate

      - name: Verify administrator and session lifecycle
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: tianwang_auth_test
          PGPASSWORD: tianwang_test_password
        run: |
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE tianwang_auth_test'
          node --test server/tests/integration/auth-lifecycle.cjs

      - name: Verify repository
        run: npm run verify

      - name: Verify PostgreSQL core and restart recovery
        run: npm run core:test

  production-containers:
    needs: verify
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: tianwang-ci
      DB_PASSWORD: fixture-postgres-password
      JWT_SECRET: fixture-jwt-signing-secret
      ENCRYPTION_KEY: fixture-encryption-secret
      BOOTSTRAP_ADMIN_USERNAME: fixtureadmin
      BOOTSTRAP_ADMIN_EMAIL: fixture@example.test
      BOOTSTRAP_ADMIN_PASSWORD: FixtureAdminPassword1!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build production images
        run: docker compose build
      - name: Inspect and replay exported runtime images
        run: |
          mkdir -p container-evidence
          mapfile -t images < <(docker compose config --images | sort -u)
          docker image inspect "${images[@]}" --format '{{.Id}} {{.Os}}/{{.Architecture}} {{.Size}}' > container-evidence/images.txt
          docker save "${images[@]}" | gzip > container-evidence/runtime-images.tar.gz
          gzip -dc container-evidence/runtime-images.tar.gz | docker load
          stat -c %s container-evidence/runtime-images.tar.gz > container-evidence/archive-bytes.txt
      - name: Start database and apply the packaged migration
        run: |
          docker compose up -d --no-build --pull never --wait postgres
          docker compose run --no-deps --name tianwang-ci-migration app /app/deploy/database-migrate
      - name: Start the complete production topology
        run: docker compose up -d --no-build --pull never --wait
      - name: Verify packaged dashboard and authentication
        run: node --test tests/deployment/runtime.cjs
      - name: Capture runtime evidence
        if: always()
        run: |
          mkdir -p container-evidence
          docker compose ps --all --format json > container-evidence/services.json
          docker compose logs --no-color > container-evidence/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-container-evidence
          path: container-evidence
          retention-days: 7
      - name: Stop this verification stack
        if: always()
        run: |
          docker compose stop
          docker container rm tianwang-ci-migration
