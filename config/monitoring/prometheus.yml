# Prometheus配置 - 天网安全监控系统
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # 后端API服务监控
  - job_name: 'tianwang-server'
    static_configs:
      - targets: ['server:8000']
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  # 前端应用监控
  - job_name: 'tianwang-client'
    static_configs:
      - targets: ['client:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # AI引擎监控
  - job_name: 'tianwang-ai-engine'
    static_configs:
      - targets: ['ai-engine:8001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # 数据库监控
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 60s

  # Redis监控
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Kafka监控
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
    scrape_interval: 30s

  # 系统监控
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
