x-gitops:
  public_entry:
    service: app
    container_port: 8000
    healthcheck:
      path: /health
      expected_json:
        service: tianwang
        status: ok
  services:
    postgres: {exposure: internal}

services:
  # PostgreSQL 数据库 - 用户、配置等关系型数据
  postgres:
    platform: linux/amd64
    image: tianwang-postgres:15-alpine
    build:
      context: ./docker/production/runtime-images
      dockerfile: postgres.Dockerfile
    environment:
      POSTGRES_DB: tianwang
      POSTGRES_USER: tianwang
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tianwang -d tianwang"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - tianwang-network

  # 前端、API、实时连接与后台任务
  app:
    platform: linux/amd64
    image: tianwang-app:latest
    build:
      context: .
      dockerfile: docker/production/app.Dockerfile
    environment:
      NODE_ENV: production
      APP_PORT: 8000
      LOG_LEVEL: info
      CORS_ORIGIN: https://tianwang.szlk.uk
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?Set BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tianwang
      DB_USER: tianwang
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
    volumes:
      - server_data:/app/server/data
      - server_keys:/app/server/keys
      - server_uploads:/app/server/uploads
      - server_reports:/app/server/reports
      - server_downloads:/app/server/downloads
      - server_logs:/app/server/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tianwang-network
    ports:
      - "18080:8000"
    restart: unless-stopped


# 旧卷声明保留供数据审计；不挂载到应用，也不执行删除。
volumes:
  zookeeper_data:
  zookeeper_log:
  server_data:
  server_keys:
  server_uploads:
  server_reports:
  server_downloads:
  server_logs:
  ai_models:
  ai_logs:
  postgres_data:
  postgres_v2_data:
  influxdb_data:
  influxdb_config:
  redis_data:
  kafka_data:
  custom_sigma_rules:

networks:
  tianwang-network:
    driver: bridge
