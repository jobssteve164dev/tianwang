title: Windows Backdoor Detection
id: 2025-003
status: stable
description: Detects backdoor activities on Windows systems
author: Tianwang Security Team
date: 2025/01/01
modified: 2025/01/01
tags:
  - attack.persistence
  - attack.command_and_control
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4688
    CommandLine|contains:
      - 'reverse shell'
      - 'bind shell'
      - 'meterpreter'
      - 'beacon'
      - 'c2'
      - 'command and control'
      - 'listener'
      - 'payload'
      - 'shellcode'
      - 'exploit'
  condition: selection
falsepositives:
  - Penetration testing
  - Security research
level: high
