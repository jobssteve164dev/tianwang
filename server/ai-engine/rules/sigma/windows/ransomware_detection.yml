title: Windows Ransomware Detection
id: 2025-002
status: stable
description: Detects ransomware activities on Windows systems
author: Tianwang Security Team
date: 2025/01/01
modified: 2025/01/01
tags:
  - attack.impact
  - attack.defense_evasion
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4663
    ObjectName|contains:
      - '.encrypted'
      - '.locked'
      - '.crypto'
      - '.cryptolocker'
      - '.cryptowall'
      - '.locky'
      - '.cerber'
      - '.petya'
      - '.wannacry'
  condition: selection
falsepositives:
  - Legitimate file encryption
  - Backup software
level: high
